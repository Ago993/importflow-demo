name: Test ImportFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check core.js
          node --check app.js
      - name: Run tests
        run: |
          node tests/test_core.js
          node tests/test_security.js
